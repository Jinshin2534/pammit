# ローカルでもEC2でも同じ compose が動く。
# 「ローカルでは動くのに本番で落ちる」を構造的に起きにくくするため。
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://pammit:pammit@db:5432/pammit
    depends_on: [db]
    volumes: ["./app:/app/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pammit
      POSTGRES_PASSWORD: pammit
      POSTGRES_DB: pammit
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  pgdata:
