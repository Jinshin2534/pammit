plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pammitstt'
version = '0.1.0'

android {
  namespace "expo.modules.pammitstt"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // sherpa-onnx の公式AAR。scripts/fetch-native-models.sh で取得する
  implementation project(':pammit-stt$sherpa-onnx')
}
